name: Build single-file site

on:
  workflow_dispatch:
  push:
    branches:
      - claude/3d-driving-game-y9dm91
    paths:
      - "src/**"
      - "scripts/build-single.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-single.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tek dosyalık siteyi yeniden derle"
          git push
